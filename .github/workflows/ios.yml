name: iOS

# Swift package tests and a simulator build for every pull request that
# changes the iOS app. The UI tests cost many macOS minutes, so they run
# only when a person starts this workflow by hand with `ui_tests` set.
# The Actions tab shows "Run workflow" only when this file is on the default
# branch. Before that, use: gh workflow run ios.yml --ref <branch> -f ui_tests=true
on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/check-ios-view-shims.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      ui_tests:
        description: "Run the UI tests on one iPhone simulator (about 30 to 90 macOS minutes)"
        type: boolean
        default: false
      ui_test_classes:
        description: "UI test classes to run, separated by spaces. Empty runs all of them."
        type: string
        default: ""
      store_screenshots:
        description: "Photograph the App Store listing on iPhone, iPad and iPhone Duo simulators"
        type: boolean
        default: false
      store_devices:
        description: "Devices to photograph. Pick one device while you fix a failure."
        type: choice
        options: [both, iphone, ipad, duo, all]
        default: both
      store_tests:
        description: "Test methods of StoreListingScreenshotUITests, separated by spaces (for example testEnglishListing). Empty runs all of them."
        type: string
        default: ""
      store_runner:
        description: "Runner label for the store screenshots"
        type: string
        default: "xcode-27"

permissions:
  contents: read

concurrency:
  # A new push to a pull request stops the older run of that pull request.
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Swift tests + iOS build
    runs-on: xcode-27
    # A hang guard. A clean build takes about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: "No #available branch in a View extension"
        # This shape makes IRGen run without end. See ios/App/BackDeployCompat.swift.
        run: bash scripts/check-ios-view-shims.sh

      - name: CompanionCore tests
        run: swift test --package-path ios

      - name: Restore the Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/spm-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Keep compiling after the first error
        # One run then shows the errors of all files, not only the first batch.
        run: |
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          defaults write com.apple.dt.xcodebuild IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Build the app, the extensions and the UI test bundle
        # One arm64 slice for the simulator, and no code signing. The scheme
        # builds the widget and share extensions as app dependencies.
        # build-for-testing also compiles the UI test bundle, but runs nothing.
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -project SeiraCompanion.xcodeproj \
            -scheme SeiraCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E '(error|fatal error):' "$RUNNER_TEMP/xcodebuild.log" | sed -E 's#^.*/ios/#ios/#' | sort -u | head -200; tail -40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: No Swift expression or body over the type-check limit
        # ios/project.yml makes the compiler warn at 500 ms for one
        # expression or function body. The shared runner is about 2x slower
        # than a Mac, so the step lists every warning and fails only at 1500 ms.
        run: |
          fail_over_ms=1500
          warnings=$(grep -E 'took [0-9]+ms to type-check \(limit: ' "$RUNNER_TEMP/xcodebuild.log" | sed -E 's#^.*/ios/##' | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "Over the 500 ms warning limit on this runner (fails at ${fail_over_ms} ms):"
            printf '%s\n' "$warnings"
          fi
          hits=$(printf '%s\n' "$warnings" | awk -v limit="$fail_over_ms" 'match($0, /took [0-9]+ms/) { ms = substr($0, RSTART + 5, RLENGTH - 7) + 0; if (ms > limit) print }')
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::The Swift type checker spent over ${fail_over_ms} ms on the expression(s) above. Split that body into smaller views or functions, and give colours chosen by a ternary an explicit Color type."
            exit 1
          fi
          echo "No expression or function body took the type checker over ${fail_over_ms} ms."

  catalyst:
    name: Mac Catalyst build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Restore the Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/spm-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Keep compiling after the first error
        run: |
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          defaults write com.apple.dt.xcodebuild IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Build the app for Mac Catalyst
        # No code signing. The scheme builds both extensions as app dependencies.
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -project SeiraCompanion.xcodeproj \
            -scheme SeiraCompanion \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E '(error|fatal error):' "$RUNNER_TEMP/xcodebuild.log" | sed -E 's#^.*/ios/#ios/#' | sort -u | head -200; tail -40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: The app holds both extensions and keeps the iOS bundle ID
        run: |
          app=$(find "$RUNNER_TEMP/derived-data/Build/Products" -maxdepth 2 -name 'SeiraCompanion.app' -path '*maccatalyst*' | head -1)
          test -n "$app" || { echo "::error::No Mac Catalyst app in the build products"; find "$RUNNER_TEMP/derived-data/Build/Products" -maxdepth 2; exit 1; }
          echo "App: $app"
          ls "$app/Contents/PlugIns"
          for appex in SeiraCompanionWidgets.appex SeiraShareExtension.appex; do
            test -d "$app/Contents/PlugIns/$appex" || { echo "::error::Missing $appex in Contents/PlugIns"; exit 1; }
          done
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$id" = "bot.seira.app" || { echo "::error::CFBundleIdentifier is $id, not bot.seira.app"; exit 1; }
          echo "CFBundleIdentifier is $id"

  ui-tests:
    name: UI tests (iPhone simulator)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.ui_tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/spm-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Run the UI tests on a new iPhone simulator
        # The tests use bundled synthetic data. They pair with no computer.
        env:
          UI_TEST_CLASSES: ${{ inputs.ui_test_classes }}
        run: |
          set -euo pipefail
          cd ios
          runtime_id=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          if not runtimes: raise SystemExit("No iOS simulator runtime is available")
          runtimes.sort(key=lambda r: tuple(int(p) for p in r["version"].split(".")))
          print(runtimes[-1]["identifier"])
          ')
          type_id=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          import re
          types = [t for t in json.load(sys.stdin)["devicetypes"] if re.fullmatch(r"iPhone \d+ Pro", t["name"])]
          if not types: raise SystemExit("No iPhone Pro simulator type is available")
          types.sort(key=lambda t: int(re.search(r"\d+", t["name"]).group()))
          print(types[-1]["identifier"])
          ')
          simulator_id=$(xcrun simctl create "seira-ui-${GITHUB_RUN_ID}" "$type_id" "$runtime_id")
          trap 'xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true' EXIT
          only=()
          set -f
          for name in $UI_TEST_CLASSES; do
            case "$name" in
              *[!A-Za-z0-9_]*) echo "::error::Not a test class name: $name"; exit 1 ;;
            esac
            only+=("-only-testing:SeiraCompanionUITests/$name")
          done
          set +f
          xcodebuild \
            -project SeiraCompanion.xcodeproj \
            -scheme SeiraCompanion \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -resultBundlePath "$RUNNER_TEMP/seira-ui-tests.xcresult" \
            -parallel-testing-enabled NO \
            ${only[@]+"${only[@]}"} \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Export the screenshots of the UI tests
        if: always()
        run: |
          set +e
          out="$RUNNER_TEMP/glance-screenshots"
          mkdir -p "$out"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/seira-ui-tests.xcresult" --output-path "$out"
          ls -la "$out"

      - name: Keep the screenshots of the UI tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glance-screenshots
          path: ${{ runner.temp }}/glance-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seira-ui-tests.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  store-screenshots:
    name: App Store screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.store_screenshots
    runs-on: ${{ inputs.store_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/spm-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Photograph the listing on each device
        env:
          STORE_DEVICES: ${{ inputs.store_devices }}
          STORE_TESTS: ${{ inputs.store_tests }}
        run: |
          set -uo pipefail
          case "${STORE_DEVICES:-both}" in
            both) devices="iphone ipad" ;;
            all) devices="iphone ipad duo" ;;
            iphone|ipad|duo) devices="$STORE_DEVICES" ;;
            *) echo "::error::Not a device choice: $STORE_DEVICES"; exit 1 ;;
          esac
          only=()
          set -f
          for name in $STORE_TESTS; do
            case "$name" in
              *[!A-Za-z0-9_]*) echo "::error::Not a test method name: $name"; exit 1 ;;
            esac
            only+=("-only-testing:SeiraCompanionUITests/StoreListingScreenshotUITests/$name")
          done
          set +f
          if [ "${#only[@]}" -eq 0 ]; then
            only=("-only-testing:SeiraCompanionUITests/StoreListingScreenshotUITests")
          fi
          xcodebuild -version
          cd ios
          out="$RUNNER_TEMP/store-screenshots"
          mkdir -p "$out"
          xcrun simctl list runtimes
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          # Prints "<runtime id> <device type id>" for the newest runtime that has the device.
          pick() {
            python3 - "$RUNNER_TEMP/runtimes.json" "$1" <<'PY'
          import json, re, sys
          pattern = {"iphone": r"iPhone \d+ Pro Max", "ipad": r"iPad Pro 13-inch.*", "duo": r"iPhone Duo.*"}[sys.argv[2]]
          runtimes = [r for r in json.load(open(sys.argv[1]))["runtimes"] if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          runtimes.sort(key=lambda r: tuple(int(p) for p in r["version"].split(".")), reverse=True)
          for runtime in runtimes:
              types = [t for t in runtime["supportedDeviceTypes"] if re.fullmatch(pattern, t["name"])]
              types.sort(key=lambda t: [int(n) for n in re.findall(r"\d+", t["name"])])
              if types:
                  print(runtime["identifier"], types[-1]["identifier"])
                  raise SystemExit(0)
          for runtime in runtimes:
              print(runtime["identifier"], sorted(t["name"] for t in runtime["supportedDeviceTypes"] if t["name"].startswith("iPhone")), file=sys.stderr)
          raise SystemExit(f"No runtime has a device type that matches {pattern}")
          PY
          }
          status=0
          for device in $devices; do
            picks=$(pick "$device") || { status=1; break; }
            echo "Picked for $device: $picks"
            read -r runtime_id type_id <<< "$picks"
            simulator_id=$(xcrun simctl create "seira-store-${device}-${GITHUB_RUN_ID}" "$type_id" "$runtime_id")
            xcrun simctl boot "$simulator_id"
            xcrun simctl bootstatus "$simulator_id" -b
            xcrun simctl io "$simulator_id" enumerate 2>&1 | grep -iE "display|size|class" || true
            xcrun simctl ui "$simulator_id" appearance dark
            xcrun simctl status_bar "$simulator_id" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4
            bundle="$RUNNER_TEMP/store-${device}.xcresult"
            TEST_RUNNER_STORE_DEVICE="$device" xcodebuild \
              -project SeiraCompanion.xcodeproj \
              -scheme SeiraCompanion \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=${simulator_id}" \
              -derivedDataPath "$RUNNER_TEMP/derived-data" \
              -clonedSourcePackagesDirPath "$HOME/spm-packages" \
              -resultBundlePath "$bundle" \
              -parallel-testing-enabled NO \
              ${only[@]+"${only[@]}"} \
              CODE_SIGNING_ALLOWED=NO \
              test || status=$?
            raw="$RUNNER_TEMP/store-raw-${device}"
            mkdir -p "$raw"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw" || true
            python3 - "$raw" "$out" <<'PY'
          import json, os, re, shutil, sys
          raw, out = sys.argv[1], sys.argv[2]
          manifest = json.load(open(os.path.join(raw, "manifest.json")))
          for test in manifest:
              for item in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}$", "", os.path.splitext(item["suggestedHumanReadableName"])[0])
                  if re.match(r"(iphone|ipad|duo)-", name):
                      shutil.copy(os.path.join(raw, item["exportedFileName"]), os.path.join(out, name + ".png"))
          PY
            xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then break; fi
          done
          ls -la "$out"
          exit "$status"

      - name: Keep the store screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/store-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store-*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
