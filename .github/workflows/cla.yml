name: CLA

# Security invariant: pull_request_target runs this file from main with the
# base repository token. Never check out or run code from the pull request here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number }}

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the contributor license agreement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = "1.0";
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const author = pr.user;

            const maintainer = ["OWNER", "MEMBER"].includes(pr.author_association);
            const bot = author.type === "Bot" || author.login.endsWith("[bot]");
            if (maintainer || bot) {
              core.info(`${author.login} does not need the CLA.`);
              return;
            }

            // Security invariant: only a comment by github-actions[bot] counts as a record.
            const marker = `<!-- seira-cla account:${author.id} version:${version} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const recorded = comments.some(
              (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            if (recorded) {
              core.info(`${author.login} agreed to CLA version ${version} on this pull request.`);
              return;
            }

            const box = new RegExp(
              `^\\s*[-*]\\s+\\[[xX]\\]\\s+I have read CLA\\.md version ${version.replaceAll(".", "\\.")} and I agree to it\\.`,
              "m",
            );
            if (!box.test(pr.body ?? "")) {
              core.setFailed(`Read CLA.md, then tick the CLA version ${version} box in the pull request description.`);
              return;
            }

            const { data: cla } = await github.rest.repos.getContent({
              owner,
              repo,
              path: "CLA.md",
              ref: pr.base.sha,
            });
            const body = [
              marker,
              "Contributor license agreement recorded.",
              "",
              `- Account: \`${author.login}\`, id ${author.id}`,
              `- Agreement: [CLA.md version ${version}](https://github.com/${owner}/${repo}/blob/${pr.base.sha}/CLA.md), blob \`${cla.sha}\``,
              `- Pull request head: \`${pr.head.sha}\``,
              `- Time (UTC): ${new Date().toISOString()}`,
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.info(`Recorded CLA version ${version} for ${author.login}.`);
