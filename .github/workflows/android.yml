name: Android

# Unit tests and a debug build for every change to the Android app.
# The :core tests read the captured server responses in the iOS fixtures
# folder, so a change there runs this workflow too.
# No signing material: CI builds only the debug variant.
on:
  pull_request:
    paths:
      - "android/**"
      - "ios/Tests/CompanionCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/Tests/CompanionCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  # A new push to a pull request stops the older run of that pull request.
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    # A hang guard.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The organization allows only actions that GitHub owns, so the Gradle
      # cache comes from setup-java and not from gradle/actions.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install the Android SDK platform
        # compileSdk 37 is not on the runner image.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      # Robolectric downloads its android-all jar from Maven Central into
      # ~/.m2 on the first test that needs it. A failed download fails the
      # test class (seira-mobile#139). Keep the jars between runs. The key
      # follows the Gradle file that pins the Robolectric version, and an
      # older cache is a valid fallback.
      - name: Restore the Robolectric jars
        id: robolectric-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-jars-${{ runner.os }}-

      - name: Core tests, app unit tests and debug build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:verifyReleaseLauncherManifest

      # Save also when a test failed: the jars are good once they are down.
      - name: Save the Robolectric jars
        if: ${{ always() && steps.robolectric-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Release signing refuses partial and renamed settings
        run: node ../scripts/check-release-signing.mjs

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
