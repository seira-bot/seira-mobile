name: Apple release

# Builds, signs and uploads the iOS app and the macOS (Mac Catalyst) app to App Store Connect.
# Then it puts each build on its App Store version and sends the version to App Review.
#   tag ios-vX.Y.Z   build and release both apps. X.Y.Z must equal MARKETING_VERSION in ios/project.yml.
#   by hand          choose the platforms. Set submit to false to upload to TestFlight only.
#   every day        send the builds of the newest ios-v* tag that are not yet in review or live.
# The repository variable APPLE_AUTO_SUBMIT=false stops every submission.
# The secrets MAC_INSTALLER_P12_BASE64 and MAC_INSTALLER_P12_PASSWORD are optional.
# See ios/AppStore/RELEASE.md.
on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        options:
          - both
          - ios
          - macos
        default: both
      submit:
        description: "Send the builds to App Review. Turn off to upload to TestFlight only."
        type: boolean
        default: true
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  meta:
    name: Version and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: app-store
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      submit_matrix: ${{ steps.plan.outputs.submit_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version and plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          AUTO_SUBMIT: ${{ vars.APPLE_AUTO_SUBMIT }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6839641200' }}
        run: |
          valid='^[0-9]+(\.[0-9]+){0,2}$'
          if [ "$EVENT" = "schedule" ]; then
            tag=$(git tag --list 'ios-v*' --sort=-version:refname | head -n 1)
            if [ -z "$tag" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "build_matrix=[\"ios\"]" >> "$GITHUB_OUTPUT"
              echo "submit_matrix=[\"ALL\"]" >> "$GITHUB_OUTPUT"
              echo "No ios-v* tag exists. Nothing to submit."
              exit 0
            fi
            version="${tag#ios-v}"
            if ! printf '%s' "$version" | grep -Eq "$valid"; then
              echo "::error::The tag $tag has no valid version."
              exit 1
            fi
            {
              echo "mode=pending"
              echo "version=$version"
              echo "build="
              echo "build_matrix=[\"ios\"]"
              echo "submit_matrix=[\"ALL\"]"
            } >> "$GITHUB_OUTPUT"
            echo "Daily check for version $version from $tag."
            exit 0
          fi

          field() {
            awk -v key="$1" '
              /PRODUCT_BUNDLE_IDENTIFIER: bot\.seira\.app[[:space:]]*$/ { found = 1 }
              found && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }
            ' ios/project.yml
          }
          marketing=$(field MARKETING_VERSION)
          project_build=$(field CURRENT_PROJECT_VERSION)
          if ! printf '%s' "$marketing" | grep -Eq "$valid"; then
            echo "::error::The app version in ios/project.yml is not valid."
            exit 1
          fi
          if ! printf '%s' "$project_build" | grep -Eq '^[0-9]+$'; then
            echo "::error::The project build number in ios/project.yml is not valid."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "ios-v$marketing" ]; then
            echo "::error::The tag is $REF_NAME, but MARKETING_VERSION in ios/project.yml is $marketing. Expected the tag ios-v$marketing. Nothing was built."
            exit 1
          fi

          missing=""
          for name in ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing in the environment app-store:${missing}."
            exit 1
          fi
          ( umask 077; printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8" )
          status=0
          build=$(ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" node ios/AppStore/tools/asc-release.mjs next-build --base "$project_build") || status=$?
          rm -f "$RUNNER_TEMP/asc.p8"
          if [ "$status" -ne 0 ]; then
            echo "::error::Could not read the build numbers from App Store Connect."
            exit 1
          fi
          if ! printf '%s' "$build" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::The next build number is not valid."
            exit 1
          fi

          platforms="${INPUT_PLATFORMS:-both}"
          case "$platforms" in
            ios)   build='["ios"]';          submit='["IOS"]' ;;
            macos) build='["macos"]';        submit='["MAC_OS"]' ;;
            both)  build='["ios","macos"]';  submit='["IOS","MAC_OS"]' ;;
            *) echo "::error::The platforms value is not valid."; exit 1 ;;
          esac
          {
            echo "mode=release"
            echo "version=$marketing"
            echo "build=$build"
            echo "build_matrix=$build"
            echo "submit_matrix=$submit"
          } >> "$GITHUB_OUTPUT"
          echo "Version $marketing, build $build, platforms $platforms."
          if [ "$AUTO_SUBMIT" = "false" ]; then
            echo "::notice::APPLE_AUTO_SUBMIT is false. The builds are uploaded and nothing goes to App Review."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    if: needs.meta.outputs.mode == 'release'
    runs-on: xcode-27
    timeout-minutes: 75
    environment: app-store
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.meta.outputs.build_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the App Store Connect secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing in the environment app-store:${missing}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that Xcode is 27 or newer
        # App Store Connect requires the iOS 27 SDK (Xcode 27) for uploads from April 2027 (ITMS-90725).
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1]; exit }')
          if [ -z "$major" ] || [ "$major" -lt 27 ]; then
            echo "::error::Xcode 27 or newer is required. App Store Connect rejects uploads built with an older iOS SDK."
            exit 1
          fi

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Register a Mac for Mac Catalyst signing
        # Apple makes no Mac Catalyst development profile while the team has no Mac device.
        if: matrix.platform == 'macos'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          hw=$(system_profiler SPHardwareDataType)
          udid=$(printf '%s\n' "$hw" | awk -F': ' '/Provisioning UDID/ { print $2; exit }')
          [ -n "$udid" ] || udid=$(printf '%s\n' "$hw" | awk -F': ' '/Hardware UUID/ { print $2; exit }')
          if [ -n "$udid" ]; then echo "::add-mask::$udid"; fi
          ( umask 077; printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-device.p8" )
          status=0
          ASC_KEY_PATH="$RUNNER_TEMP/asc-device.p8" node ios/AppStore/tools/asc-device.mjs ensure-mac --udid "$udid" || status=$?
          rm -f "$RUNNER_TEMP/asc-device.p8"
          exit "$status"

      - name: Import the Mac installer certificate
        if: matrix.platform == 'macos'
        env:
          P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] && [ -z "$P12_PASSWORD" ]; then
            echo "No installer certificate secret is set. Xcode uses the cloud-managed certificate."
            exit 0
          fi
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Set both MAC_INSTALLER_P12_BASE64 and MAC_INSTALLER_P12_PASSWORD, or neither."
            exit 1
          fi
          keychain="$RUNNER_TEMP/mac-installer.keychain-db"
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          ( umask 077; printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mac-installer.p12" )
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/mac-installer.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          echo "MAC_INSTALLER_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Installer certificates in the keychain:"
          security find-identity -v "$keychain" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - name: Archive with code signing
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ needs.meta.outputs.build }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          case "$PLATFORM" in
            ios)   destination='generic/platform=iOS' ;;
            macos) destination='generic/platform=macOS,variant=Mac Catalyst' ;;
            *) echo "::error::The platform is not valid."; exit 1 ;;
          esac
          ( umask 077; printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8" )
          cd ios
          xcodebuild archive \
            -project SeiraCompanion.xcodeproj \
            -scheme SeiraCompanion \
            -configuration Release \
            -destination "$destination" \
            -archivePath "$RUNNER_TEMP/Seira.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-packages" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E '(error|fatal error):' "$RUNNER_TEMP/xcodebuild.log" | sed -E 's#^.*/ios/#ios/#' | sort -u | head -200; tail -40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Show the entitlements of the Mac app
        if: matrix.platform == 'macos'
        run: |
          apps=("$RUNNER_TEMP"/Seira.xcarchive/Products/Applications/*.app)
          app="${apps[0]}"
          [ -d "$app" ] || { echo "::error::The archive has no app."; exit 1; }
          echo "App: $(basename "$app")"
          codesign -d --entitlements - "$app" 2>&1 || true
          for appex in "$app"/Contents/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            echo "Extension: $(basename "$appex")"
            codesign -d --entitlements - "$appex" 2>&1 || true
          done

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Seira.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -E '(error|fatal error):' "$RUNNER_TEMP/export.log" | sort -u | head -100; tail -40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/export.log"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete the API key file and the temporary keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/mac-installer.p12"
          if [ -n "${MAC_INSTALLER_KEYCHAIN:-}" ]; then
            security delete-keychain "$MAC_INSTALLER_KEYCHAIN" || true
          fi

      - name: Write the run summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Build $PLATFORM"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Result | $JOB_STATUS |"
            echo "| Commit | \`$(git rev-parse HEAD 2>/dev/null || echo unknown)\` |"
            echo "| Version | $VERSION |"
            echo "| Build number | $BUILD |"
            echo "| Xcode | $(xcodebuild -version 2>/dev/null | tr '\n' ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    name: Submit ${{ matrix.platform }}
    needs: [meta, build]
    # Every build must succeed first. After a partial failure, the daily run
    # sends the platform whose build is valid.
    if: >-
      ${{ !cancelled()
      && needs.meta.result == 'success'
      && needs.meta.outputs.mode != 'none'
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.meta.outputs.mode == 'pending'))
      && vars.APPLE_AUTO_SUBMIT != 'false'
      && (github.event_name != 'workflow_dispatch' || inputs.submit == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: app-store
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.meta.outputs.submit_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit to App Review
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6839641200' }}
          APPLE_AUTO_SUBMIT: ${{ vars.APPLE_AUTO_SUBMIT }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          missing=""
          for name in ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing in the environment app-store:${missing}."
            exit 1
          fi
          ( umask 077; printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8" )
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          if [ "$PLATFORM" = "ALL" ]; then
            node ios/AppStore/tools/asc-release.mjs pending --version "$VERSION"
          else
            node ios/AppStore/tools/asc-release.mjs submit --version "$VERSION" --platform "$PLATFORM" --build "$BUILD" --wait-minutes 90
          fi

      - name: Delete the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
