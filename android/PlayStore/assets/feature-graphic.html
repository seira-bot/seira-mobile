<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:500px; overflow:hidden; font-family:Inter,system-ui,sans-serif;
         background:#0C0F14; color:#F5F7F6; }
  .wrap { position:relative; width:1024px; height:500px; display:flex; align-items:center;
           gap:56px; padding:0 72px; }
  .glow { position:absolute; width:620px; height:620px; right:-160px; top:-160px; border-radius:50%;
           background:radial-gradient(circle, rgba(225,29,72,0.28) 0%, rgba(225,29,72,0) 68%); }
  .mark { position:relative; flex:0 0 auto; display:grid; place-items:center;
           width:230px; height:230px; border-radius:52px; background:#0C0F14; overflow:hidden;
           box-shadow:0 30px 70px rgba(0,0,0,0.55); }
  .mark img { display:block; width:230px; height:230px; }
  .copy { position:relative; }
  h1 { font-size:66px; font-weight:700; letter-spacing:-0.035em; line-height:1; }
  p { margin-top:22px; font-size:29px; font-weight:400; line-height:1.35; color:#A8B3AE; max-width:520px; letter-spacing:-0.01em; }
  .rule { margin-top:30px; width:88px; height:5px; border-radius:99px; background:#E11D48; }
</style></head><body>
<div class="wrap"><div class="glow"></div>
  <div class="mark"><img src="play-icon-512.png" alt="Seira" width="230" height="230"></div>
  <div class="copy">
    <h1>Seira</h1>
    <p>Your own AI bots, running on your own computer — answered from your phone.</p>
    <div class="rule"></div>
  </div>
</div></body></html>
